<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>송도고등학교 현황 조회</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f6fa;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h2 { margin-top: 0; color: #2c3e50; }
        p { color: #7f8c8d; margin-bottom: 25px; font-size: 14px; }
        
        input[type="text"] {
            width: 80%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: #3498db; }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 80%;
        }
        button:hover { background-color: #2980b9; }
        
        .msg { margin-top: 20px; font-size: 14px; font-weight: bold; min-height: 20px;}
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 15px auto 0;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📊 응시 현황 조회</h2>
        <p>자신의 회원번호를 정확히 입력해 주세요.</p>
        
        <input type="text" id="searchKeyword" placeholder="회원번호 입력" maxlength="8" onkeypress="handleEnter(event)">
        <button onclick="searchAndRedirect()">조회하기</button>
        
        <div id="loader" class="loader"></div>
        <div id="status" class="msg"></div>
    </div>

    <script>
        // ⚙️ 선생님의 깃허브 정보
        const OWNER = 'yjh6028-ship-it'; 
        const REPO = 'class5-exam-statu';   
        const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;

        // 💡 [추가된 부분] 페이지가 로드될 때 로컬 스토리지에 저장된 회원번호가 있으면 불러옵니다.
        window.addEventListener('DOMContentLoaded', () => {
            const savedKeyword = localStorage.getItem('savedMemberId');
            if (savedKeyword) {
                document.getElementById('searchKeyword').value = savedKeyword;
            }
        });

        function handleEnter(e) {
            if(e.key === 'Enter') searchAndRedirect();
        }

        function searchAndRedirect() {
            const keyword = document.getElementById('searchKeyword').value.trim();
            const statusEl = document.getElementById('status');
            const loaderEl = document.getElementById('loader');

            if(!keyword) {
                statusEl.innerText = "수험번호를 입력해 주세요!";
                statusEl.style.color = "#e74c3c";
                return;
            }

            // 💡 [추가된 부분] 조회를 시도할 때 입력된 회원번호를 기기(브라우저)에 저장합니다.
            localStorage.setItem('savedMemberId', keyword);

            statusEl.innerText = "서버에서 최신 파일을 찾는 중입니다...";
            statusEl.style.color = "#7f8c8d";
            loaderEl.style.display = "block";

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    const searchPattern = `(${keyword}완료)`;
                    
                    const matchingFiles = data.filter(file => 
                        file.name.toLowerCase().endsWith('.pdf') && 
                        file.name.includes(searchPattern)
                    );

                    if (matchingFiles.length > 0) {
                        matchingFiles.sort((a, b) => a.name.localeCompare(b.name));
                        const latestPdf = matchingFiles[matchingFiles.length - 1];

                        statusEl.innerText = "파일 확인 완료! 화면을 이동합니다.";
                        statusEl.style.color = "#27ae60";
                        
                        window.location.href = `./${latestPdf.name}`;
                    } else {
                        loaderEl.style.display = "none";
                        statusEl.innerText = `[${keyword}] 수험번호로 등록된 자료가 없습니다.`;
                        statusEl.style.color = "#e74c3c";
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    loaderEl.style.display = "none";
                    statusEl.innerText = "오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";
                    statusEl.style.color = "#e74c3c";
                });
        }
    </script>
</body>
</html>
