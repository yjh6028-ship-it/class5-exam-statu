<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>송도고등학교 현황 조회</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f6fa;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-sizing: border-box; /* 패딩 포함 너비 계산 */
        }
        h2 { margin-top: 0; color: #2c3e50; }
        p { color: #7f8c8d; margin-bottom: 25px; font-size: 14px; }
        
        /* 입력창과 버튼을 감싸는 컨테이너 */
        .input-group {
            display: flex;
            flex-direction: column; /* 세로 정렬 */
            align-items: center;
            gap: 15px; /* 입력창과 버튼 사이 간격 */
            width: 100%;
        }
        
        input[type="text"] {
            width: 90%;
            padding: 12px;
            box-sizing: border-box; /* 패딩/테두리 포함 */
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: #3498db; }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 90%;
            box-sizing: border-box;
        }
        button:hover { background-color: #2980b9; }
        
        .msg { margin-top: 20px; font-size: 14px; font-weight: bold; min-height: 20px;}
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 15px auto 0;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📊 응시 현황 조회</h2>
        <p>자신의 회원번호를 정확히 입력해 주세요.</p>
        
        <div class="input-group">
            <input type="text" id="searchKeyword" placeholder="회원번호 입력" maxlength="8" onkeypress="handleEnter(event)">
            <button onclick="searchAndRedirect()">조회하기</button>
        </div>
        
        <div id="loader" class="loader"></div>
        <div id="status" class="msg"></div>
    </div>

    <script>
        // ⚙️ 선생님의 깃허브 정보
        const OWNER = 'yjh6028-ship-it'; 
        const REPO = 'class5-exam-statu';   
        const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;

        window.addEventListener('DOMContentLoaded', () => {
            const savedKeyword = localStorage.getItem('savedMemberId');
            if (savedKeyword) {
                document.getElementById('searchKeyword').value = savedKeyword;
            }
        });

        function handleEnter(e) {
            if(e.key === 'Enter') searchAndRedirect();
        }

        function searchAndRedirect() {
            const keyword = document.getElementById('searchKeyword').value.trim();
            const statusEl = document.getElementById('status');
            const loaderEl = document.getElementById('loader');

            if(!keyword) {
                statusEl.innerText = "수험번호를 입력해 주세요!";
                statusEl.style.color = "#e74c3c";
                return;
            }

            localStorage.setItem('savedMemberId', keyword);

            statusEl.innerText = "서버에서 최신 파일을 찾는 중입니다...";
            statusEl.style.color = "#7f8c8d";
            loaderEl.style.display = "block";

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    const searchPattern = `${keyword}9999`;
                    
                    const matchingFiles = data.filter(file => 
                        file.name.toLowerCase().endsWith('.pdf') && 
                        file.name.includes(searchPattern)
                    );

                    if (matchingFiles.length > 0) {
                        // 💡 [수정된 부분] 날짜/시간을 숫자로 변환하여 가장 최신(큰 숫자) 파일을 앞으로 정렬
                        matchingFiles.sort((a, b) => {
                            const extractTime = (filename) => {
                                // 20260629_114643 부분 추출
                                const match = filename.match(/^(\d{8})_(\d+)/); 
                                // 추출 성공시 두 숫자를 합쳐서 실제 Number 타입으로 리턴, 실패시 0 리턴
                                return match ? parseInt(match[1] + match[2], 10) : 0;
                            };
                            return extractTime(b.name) - extractTime(a.name);
                        });

                        // 내림차순이므로 첫 번째 [0] 인덱스가 가장 최신 파일
                        const latestPdf = matchingFiles[0];

                        statusEl.innerText = "파일 확인 완료! 화면을 이동합니다.";
                        statusEl.style.color = "#27ae60";
                        
                        window.location.href = `./${latestPdf.name}`;
                    } else {
                        loaderEl.style.display = "none";
                        statusEl.innerText = `[${keyword}] 수험번호로 등록된 자료가 없습니다.`;
                        statusEl.style.color = "#e74c3c";
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    loaderEl.style.display = "none";
                    statusEl.innerText = "오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";
                    statusEl.style.color = "#e74c3c";
                });
        }
    </script>
</body>
</html>
